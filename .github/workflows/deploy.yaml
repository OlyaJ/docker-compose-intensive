name: Deploy

on:
  push:
    branches: [main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest

    outputs:
      frontend_changed: ${{ steps.filter.outputs.frontend }}
      backend_changed: ${{ steps.filter.outputs.backend }}
      infrastructure_changed: ${{ steps.filter.outputs.infrastructure }}

    steps:
      - uses: actions/checkout@v4

      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'

            backend:
              - 'backend/**'

            infrastructure:
              - 'monitoring/**'
              - 'docker-compose.prod.yaml'
              - '.github/workflows/deploy.yml'

      - name: Debug changed services
        run: |
          echo "frontend=${{ steps.filter.outputs.frontend }}"
          echo "backend=${{ steps.filter.outputs.backend }}"
          echo "infrastructure=${{ steps.filter.outputs.infrastructure }}"

  backend-checks:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend_changed == 'true'
    uses: ./.github/workflows/checks.yaml
    with:
      context: backend

  frontend-checks:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend_changed == 'true'
    uses: ./.github/workflows/checks.yaml
    with:
      context: frontend

  build-backend:
    needs:
      - detect-changes
      - backend-checks

    if: |
      always() &&
      needs.detect-changes.outputs.backend_changed == 'true' &&
      needs.backend-checks.result == 'success'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build backend image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USER }}/devops-backend:${{ github.sha }} \
            ./backend

      - name: Push backend image
        run: |
          docker push \
            ${{ secrets.DOCKER_USER }}/devops-backend:${{ github.sha }}

  build-frontend:
    needs:
      - detect-changes
      - frontend-checks

    if: |
      always() &&
      needs.detect-changes.outputs.frontend_changed == 'true' &&
      needs.frontend-checks.result == 'success'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build frontend image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USER }}/devops-frontend:${{ github.sha }} \
            --build-arg VITE_BACKEND_URL=https://devops-lab.site/api \
            ./frontend

      - name: Push frontend image
        run: |
          docker push \
            ${{ secrets.DOCKER_USER }}/devops-frontend:${{ github.sha }}

  deploy:
    needs:
      - detect-changes
      - build-backend
      - build-frontend

    if: |
      always() &&
      (
        needs.detect-changes.outputs.backend_changed == 'true' ||
        needs.detect-changes.outputs.frontend_changed == 'true' ||
        needs.detect-changes.outputs.infrastructure_changed == 'true'
      ) &&
      (
        needs.build-backend.result == 'success' ||
        needs.build-backend.result == 'skipped'
      ) &&
      (
        needs.build-frontend.result == 'success' ||
        needs.build-frontend.result == 'skipped'
      )

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Copy production compose and monitoring configs
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.prod.yaml,monitoring"
          target: "/var/www/devops-lab.site"

      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}

          script: |
            set -e

            echo "${{ secrets.DOCKER_PASS }}" | \
              docker login \
              -u "${{ secrets.DOCKER_USER }}" \
              --password-stdin

            cd /var/www/devops-lab.site

            if [ "${{ needs.detect-changes.outputs.backend_changed }}" = "true" ]; then
              BACKEND_IMAGE="${{ secrets.DOCKER_USER }}/devops-backend:${{ github.sha }}"

              docker pull "$BACKEND_IMAGE"

              sed -i \
                "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=$BACKEND_IMAGE|" \
                .env
            fi

            if [ "${{ needs.detect-changes.outputs.frontend_changed }}" = "true" ]; then
              FRONTEND_IMAGE="${{ secrets.DOCKER_USER }}/devops-frontend:${{ github.sha }}"

              docker pull "$FRONTEND_IMAGE"

              sed -i \
                "s|^FRONTEND_IMAGE=.*|FRONTEND_IMAGE=$FRONTEND_IMAGE|" \
                .env
            fi

            docker compose \
              -f docker-compose.prod.yaml \
              pull

            docker compose \
              -f docker-compose.prod.yaml \
              up -d \
              --remove-orphans

            docker compose \
              -f docker-compose.prod.yaml \
              ps
              